<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Engineering CrossCheck Agent — 실행 링크</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 520px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 32px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; color: #94a3b8; font-size: 14px; }
  a.link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
    border-radius: 12px;
    text-decoration: none;
    color: #f8fafc;
    background: #0f172a;
    border: 1px solid #334155;
    transition: border-color .15s, transform .15s;
  }
  a.link:hover { border-color: #38bdf8; transform: translateY(-1px); }
  a.link .name { font-weight: 600; }
  a.link .url { font-size: 12px; color: #64748b; font-family: ui-monospace, monospace; }
  .hint { margin-top: 20px; font-size: 12px; color: #64748b; line-height: 1.6; }
  code { background: #0f172a; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Engineering CrossCheck Agent</h1>
    <p class="sub">개발 서버 실행 링크</p>

    <a class="link" href="http://localhost:3000" target="_blank" rel="noopener">
      <span class="name">웹 앱 (Frontend)</span>
      <span class="url">localhost:3000</span>
    </a>
    <a class="link" href="http://localhost:8000/docs" target="_blank" rel="noopener">
      <span class="name">API 문서 (Swagger)</span>
      <span class="url">localhost:8000/docs</span>
    </a>
    <a class="link" href="http://localhost:8000" target="_blank" rel="noopener">
      <span class="name">Backend 루트</span>
      <span class="url">localhost:8000</span>
    </a>

    <p class="hint">
      링크가 열리지 않으면 서버가 꺼진 상태입니다. 터미널에서 실행:<br />
      <code>cd backend &amp;&amp; ./venv/Scripts/python -m uvicorn app.main:app --port 8000</code><br />
      <code>cd frontend &amp;&amp; npm run dev</code>
    </p>
  </div>
</body>
</html>
